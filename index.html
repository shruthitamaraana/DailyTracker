<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile-Responsive Dedication Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4834d4;
            --success: #2ecc71;
            --danger: #eb4d4b;
            --bg: #f0f2f5;
            --grid-line: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            color: #2d3436;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 4px solid var(--primary);
        }

        /* Responsive Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stat-item h3 { margin: 0; font-size: 1.2rem; }
        .stat-item span { font-size: 0.65rem; opacity: 0.9; text-transform: uppercase; display: block; }

        /* Responsive Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid var(--grid-line);
            border-radius: 6px;
            font-size: 16px; /* Prevents iOS auto-zoom on focus */
        }

        .btn-add { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #636e72; color: white; border: none; cursor: pointer; }

        /* Mobile-Friendly Table */
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 30px;
            border: 1px solid var(--grid-line);
            border-radius: 8px;
            -webkit-overflow-scrolling: touch; /* Smooth scroll for iOS */
        }

        table { border-collapse: collapse; min-width: 1000px; width: 100%; }
        th, td { border: 1px solid var(--grid-line); text-align: center; height: 45px; }

        .task-name {
            min-width: 150px;
            text-align: left;
            padding: 0 10px;
            background: #fff;
            position: sticky;
            left: 0;
            z-index: 10;
            font-weight: bold;
            border-right: 2px solid var(--primary);
        }

        .status-select {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            text-align: center;
        }

        .cell-done { background-color: #d1f7e1 !important; }
        .cell-missed { background-color: #ffdce0 !important; }

        /* Chart Section */
        .chart-section {
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid var(--grid-line);
        }

        canvas { width: 100% !important; height: auto !important; }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            body { padding: 30px; }
            .controls { flex-direction: row; align-items: center; }
            .input-row { display: flex; flex-grow: 1; }
            .stat-item h3 { font-size: 1.8rem; }
            .container { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; font-size: 1.5rem;">Daily Dedication Plotter</h1>

    <div class="stats-bar">
        <div class="stat-item"><h3 id="scoreVal">0%</h3><span>Score</span></div>
        <div class="stat-item"><h3 id="bestDay">-</h3><span>Best Day</span></div>
        <div class="stat-item"><h3 id="totalWins">0</h3><span>Wins</span></div>
    </div>

    <div class="controls">
        <div class="input-row">
            <select id="monthSelect"></select>
            <select id="yearSelect"></select>
        </div>
        <input type="text" id="taskInput" placeholder="New task name..." style="flex-grow: 2;">
        <button class="btn-add" onclick="addTask()">Add Task</button>
        <button class="btn-clear" onclick="clearMonth()">Clear</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="headerRow"><th class="task-name">Activities</th></tr>
            </thead>
            <tbody id="taskBody"></tbody>
        </table>
    </div>

    <div class="chart-section">
        <h3 style="margin-top:0">Dedication Trend (Monthly Plot)</h3>
        <canvas id="trendChart"></canvas>
    </div>
</div>

<script>
    let tasks = [];
    let lineChart = null;
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    const mSelect = document.getElementById('monthSelect');
    const ySelect = document.getElementById('yearSelect');

    // Populate selectors
    months.forEach((m, i) => mSelect.innerHTML += `<option value="${i}">${m}</option>`);
    const currY = new Date().getFullYear();
    for(let i=currY-1; i<=currY+2; i++) ySelect.innerHTML += `<option value="${i}" ${i===currY?'selected':''}>${i}</option>`;
    
    mSelect.value = new Date().getMonth();
    mSelect.onchange = ySelect.onchange = loadData;

    function getStoreKey() { return `plot_v3_${ySelect.value}_${mSelect.value}`; }
    function getDays() { return new Date(ySelect.value, parseInt(mSelect.value)+1, 0).getDate(); }

    function loadData() {
        const saved = localStorage.getItem(getStoreKey());
        tasks = saved ? JSON.parse(saved) : [];
        render();
    }

    function render() {
        const days = getDays();
        const hr = document.getElementById('headerRow');
        while(hr.cells.length > 1) hr.deleteCell(1);
        for(let i=1; i<=days; i++) {
            let th = document.createElement('th');
            th.innerText = i;
            hr.appendChild(th);
        }

        const tbody = document.getElementById('taskBody');
        tbody.innerHTML = '';

        tasks.forEach((task, tIdx) => {
            const tr = document.createElement('tr');
            const nameTd = document.createElement('td');
            nameTd.className = 'task-name';
            nameTd.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:13px">${task.name}</span>
                    <button onclick="deleteTask(${tIdx})" style="border:none; background:none; color:red; font-weight:bold; padding:5px;">×</button>
                </div>`;
            tr.appendChild(nameTd);

            for(let d=0; d<days; d++) {
                const td = document.createElement('td');
                const val = task.data[d] || 'none';
                if(val === 'done') td.className = 'cell-done';
                if(val === 'miss') td.className = 'cell-missed';

                td.innerHTML = `
                    <select class="status-select" onchange="updateCell(${tIdx}, ${d}, this.value)">
                        <option value="none" ${val==='none'?'selected':''}>-</option>
                        <option value="done" ${val==='done'?'selected':''}>✓</option>
                        <option value="miss" ${val==='miss'?'selected':''}>×</option>
                    </select>`;
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
        updateAnalytics();
    }

    function updateCell(tIdx, dIdx, val) {
        tasks[tIdx].data[dIdx] = val;
        save();
        render(); // Refresh colors
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        if(!input.value) return;
        tasks.push({ name: input.value, data: new Array(getDays()).fill('none') });
        input.value = '';
        save();
        render();
    }

    function deleteTask(idx) {
        if(confirm("Delete this task?")) {
            tasks.splice(idx, 1);
            save();
            render();
        }
    }

    function clearMonth() {
        if(confirm("Clear this entire month?")) {
            localStorage.removeItem(getStoreKey());
            loadData();
        }
    }

    function save() { localStorage.setItem(getStoreKey(), JSON.stringify(tasks)); }

    function updateAnalytics() {
        const totalDays = getDays();
        let dailyCounts = new Array(totalDays).fill(0);
        let totalDone = 0;
        let totalPossible = tasks.length * totalDays;

        tasks.forEach(task => {
            task.data.forEach((status, dIdx) => {
                if(status === 'done') { dailyCounts[dIdx]++; totalDone++; }
            });
        });

        const score = totalPossible === 0 ? 0 : Math.round((totalDone / totalPossible) * 100);
        document.getElementById('scoreVal').innerText = score + "%";
        document.getElementById('totalWins').innerText = totalDone;

        const maxVal = Math.max(...dailyCounts);
        document.getElementById('bestDay').innerText = maxVal > 0 ? `Day ${dailyCounts.indexOf(maxVal)+1}` : "-";

        const ctx = document.getElementById('trendChart').getContext('2d');
        if(lineChart) lineChart.destroy();
        
        lineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: totalDays}, (_, i) => i + 1),
                datasets: [{
                    label: 'Plotting Wins',
                    data: dailyCounts,
                    borderColor: '#4834d4',
                    backgroundColor: 'rgba(72, 52, 212, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: window.innerWidth < 768 ? 2 : 4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }
                }
            }
        });
    }

    loadData();
</script>
</body>
</html>
